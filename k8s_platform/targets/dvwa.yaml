apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvwa
  namespace: targets
  labels:
    app.kubernetes.io/name: dvwa
    app.kubernetes.io/component: vulnerable-target
    fdtn.ai/scaffold: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dvwa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dvwa
        fdtn.ai/scaffold: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: dvwa
          image: vulnerables/web-dvwa:latest
          ports:
            - containerPort: 80
          env:
            - name: DBMS
              value: mysql
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dvwa
  namespace: targets
spec:
  selector:
    app.kubernetes.io/name: dvwa
  ports:
    - name: http
      port: 80
      targetPort: 80
