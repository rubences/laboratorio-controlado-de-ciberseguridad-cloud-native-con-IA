apiVersion: apps/v1
kind: Deployment
metadata:
  name: burp-suite
  namespace: sandbox
  labels:
    app.kubernetes.io/name: burp-suite
    app.kubernetes.io/component: dast
    fdtn.ai/scaffold: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: burp-suite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: burp-suite
        fdtn.ai/scaffold: "true"
        fdtn.ai/runtime-observed: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: burp-suite
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=Burp mock adapter available"
          ports:
            - containerPort: 8080
          env:
            - name: ADAPTER_MODE
              value: mock
---
apiVersion: v1
kind: Service
metadata:
  name: burp-suite
  namespace: sandbox
spec:
  selector:
    app.kubernetes.io/name: burp-suite
  ports:
    - name: http
      port: 8080
      targetPort: 8080
