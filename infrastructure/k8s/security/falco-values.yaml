# Valores de configuración para Falco vía Helm
# falcosecurity/falco

tty: true

# En Kind sobre WSL2 el probe eBPF clásico suele fallar porque intenta
# descargar/compilar artefactos dependientes del kernel host.
# modern_ebpf evita ese init container y tiene mejores chances reales acá.
driver:
  kind: modern_ebpf
  modernEbpf:
    leastPrivileged: false
    cpusForEachBuffer: 2

# Exponer métricas y webhooks si queremos integrarlo con Wazuh u otros
falcosidekick:
  enabled: true
  webui:
    enabled: true
  config:
    # Este bridge usa un Service ExternalName dentro del cluster para dejar de
    # depender de `wazuh.local`, que NO existe por defecto en Kind/Docker Desktop.
    # OJO: resolver el bridge NO implica que Wazuh esté levantado en el host.
    syslog:
      host: "wazuh-syslog-bridge.falco.svc.cluster.local"
      port: 514
      protocol: "udp"

# Recursos
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1024Mi
