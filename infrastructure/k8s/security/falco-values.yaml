# Valores de configuración para Falco vía Helm
# falcosecurity/falco

tty: true

# En Kind sobre WSL2 el probe eBPF clásico suele fallar porque intenta
# descargar/compilar artefactos dependientes del kernel host.
# modern_ebpf evita ese init container y tiene mejores chances reales acá.
driver:
  kind: modern_ebpf
  modernEbpf:
    leastPrivileged: false
    cpusForEachBuffer: 2

# Exponer métricas y webhooks si queremos integrarlo con Wazuh u otros
falcosidekick:
  enabled: true
  webui:
    enabled: true
  config:
    # Ejemplo: Si tuviéramos wazuh, podríamos enviar logs vía syslog o webhook
    # webhook:
    #   address: "http://wazuh-manager:1514"
    syslog:
      host: "wazuh.local"
      port: 514
      protocol: "udp"

# Recursos
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1024Mi
