---
apiVersion: v1
kind: Namespace
metadata:
  name: vulnerable-apps
---
# OWASP Juice Shop
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: vulnerable-apps
  labels:
    app: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
        fdtn.ai/runtime-observed: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: juice-shop
        image: bkimminich/juice-shop:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false # Juice shop writes to tmp
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: juice-shop-csaf
          mountPath: /juice-shop/.well-known
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: juice-shop-csaf
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: vulnerable-apps
spec:
  selector:
    app: juice-shop
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
---
# OWASP WebGoat
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webgoat
  namespace: vulnerable-apps
  labels:
    app: webgoat
  annotations:
    fdtn.ai/runtime-smoke-gate: "best-effort"
    fdtn.ai/runtime-smoke-rationale: "Upstream image currently exits with 'Unable to access jarfile webgoat.jar'; until the repo vendors a verified offline-safe entrypoint, runtime smoke reports it as WARN instead of FAIL."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webgoat
  template:
    metadata:
      labels:
        app: webgoat
        fdtn.ai/runtime-observed: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: webgoat
        image: webgoat/webgoat:latest
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
        env:
        - name: WEBWOLF_HOST
          value: "127.0.0.1"
        - name: WEBWOLF_PORT
          value: "9090"
        resources:
          limits:
            memory: "1024Mi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: webgoat
  namespace: vulnerable-apps
spec:
  selector:
    app: webgoat
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
---
# OWASP DVWA (Damn Vulnerable Web Application)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvwa
  namespace: vulnerable-apps
  labels:
    app: dvwa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dvwa
  template:
    metadata:
      labels:
        app: dvwa
        fdtn.ai/runtime-observed: "true"
    spec:
      automountServiceAccountToken: false
      containers:
      - name: dvwa
        image: vulnerables/web-dvwa:latest
        ports:
        - containerPort: 80
        env:
        - name: DBMS
          value: "MySQL"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: dvwa
  namespace: vulnerable-apps
spec:
  selector:
    app: dvwa
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
