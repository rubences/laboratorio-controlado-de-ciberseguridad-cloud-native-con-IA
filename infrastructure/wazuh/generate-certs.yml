# Wazuh Single-Node - Certificate Generator
# Generates LOCAL-ONLY cert material in ./config/wazuh_indexer_ssl_certs/.
# Run this BEFORE `docker compose -f docker-compose.yml up -d` and whenever
# you need a full certificate re-issuance/rotation for this lab stack.
# Run: docker compose -f generate-certs.yml run --rm generator
services:
  generator:
    image: wazuh/wazuh-certs-generator:0.0.2
    hostname: wazuh-certs-generator
    volumes:
      - ./config/wazuh_indexer_ssl_certs/:/certificates/
      - ./config/certs.yml:/config/certs.yml
