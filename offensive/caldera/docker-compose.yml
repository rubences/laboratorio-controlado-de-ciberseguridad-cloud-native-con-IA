services:
  caldera:
    build:
      context: ./caldera-src
      dockerfile: Dockerfile
      args:
        VARIANT: slim
    container_name: caldera_server
    restart: always
    init: true
    ports:
      - "${CALDERA_UI_BIND_IP:-127.0.0.1}:8889:8888" # Web UI
      - "${CALDERA_HTTPS_BIND_IP:-127.0.0.1}:8443:8443" # HTTPS Web UI
      - "${CALDERA_AGENT_BIND_IP:-0.0.0.0}:7010:7010" # Agent communication (TCP)
      - "${CALDERA_AGENT_BIND_IP:-0.0.0.0}:7011:7011/udp" # Agent communication (UDP)
      - "${CALDERA_AGENT_BIND_IP:-0.0.0.0}:7012:7012" # Agent communication (WebSocket)
      - "${CALDERA_DNS_BIND_IP:-0.0.0.0}:8853:8853" # DNS contact channel
      - "${CALDERA_SSH_TUNNEL_BIND_IP:-127.0.0.1}:8022:8022" # SSH tunnel contact
      - "${CALDERA_FTP_BIND_IP:-127.0.0.1}:2222:2222" # FTP contact channel
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    volumes:
      - caldera_data:/usr/src/app/data
      - caldera_conf:/usr/src/app/conf

volumes:
  caldera_data:
  caldera_conf:
